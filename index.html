<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หมู่บ้านวัฒนธรรมไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE4; --surface:#FBFAF5; --ink:#2B2118; --muted:#6B5E50;
  --wood:#7A3B1E; --gold:#B8901F; --land:#BFCF92; --land2:#B3C585;
  --water:#5E9799; --water2:#4F8789; --line:#D3CBBB; --ok:#4E6B2A; --warn:#9A3B22;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B201C; --surface:#262B26; --ink:#EFE8DC; --muted:#B5AA9A;
    --wood:#C9774D; --gold:#D9B44A; --land:#5C6B3C; --land2:#52613A;
    --water:#356A6C; --water2:#2C5C5E; --line:#3E453D; --ok:#A8C77A; --warn:#E08A6A;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .board.s0{--land:#6A6638;--land2:#5F5B31}
  :root:not([data-theme="light"]) .board.s1{--land:#4F6B36;--land2:#46612F}
  :root:not([data-theme="light"]) .board.s2{--land:#56604A;--land2:#4C5641}
}
:root[data-theme="dark"]{
  --bg:#1B201C; --surface:#262B26; --ink:#EFE8DC; --muted:#B5AA9A;
  --wood:#C9774D; --gold:#D9B44A; --land:#5C6B3C; --land2:#52613A;
  --water:#356A6C; --water2:#2C5C5E; --line:#3E453D; --ok:#A8C77A; --warn:#E08A6A;
  color-scheme: dark;
}
:root[data-theme="dark"] .board.s0{--land:#6A6638;--land2:#5F5B31}
:root[data-theme="dark"] .board.s1{--land:#4F6B36;--land2:#46612F}
:root[data-theme="dark"] .board.s2{--land:#56604A;--land2:#4C5641}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",-apple-system,"Thonburi",sans-serif;font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 24px}
h1{font-family:"Mitr","Sarabun",sans-serif;font-weight:600;font-size:1.6rem;line-height:1.2;margin:4px 0 2px;color:var(--wood)}
.sub{margin:0;color:var(--muted);font-size:.95rem}
.hidden{display:none!important}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.region{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 8px;font:inherit;color:var(--ink);cursor:pointer;text-align:center;min-height:150px}
.region svg{width:56px;height:56px}
.region b{font-family:"Mitr",sans-serif;font-weight:500;font-size:1.15rem;color:var(--wood)}
.region small{color:var(--muted);font-size:.8rem;line-height:1.35}
.region:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.topbar h1{font-size:1.35rem}
.mini{font:inherit;font-family:"Mitr",sans-serif;font-size:.85rem;padding:6px 12px;border-radius:8px;border:2px solid var(--wood);background:transparent;color:var(--wood);cursor:pointer;min-height:40px}
.season{margin:10px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.season-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.season b{font-family:"Mitr",sans-serif;font-weight:500;font-size:1.05rem}
.season span{color:var(--muted);font-size:.85rem}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .9s linear}
.mission{margin-top:6px;font-size:.88rem;color:var(--ink)}
.mission.done{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 6px}
.stat b{font-family:"Mitr",sans-serif;font-weight:500;font-size:1.1rem;display:block;line-height:1.2}
.stat span{color:var(--muted);font-size:.72rem}
.stat.low b{color:var(--warn)}
.board{--land:#BFCF92;--land2:#B3C585;position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--line);border:3px solid var(--wood);border-radius:6px;overflow:hidden;touch-action:manipulation}
.board.s0{--land:#CDCB8C;--land2:#C2C080}
.board.s1{--land:#A8C67E;--land2:#9CBA72}
.board.s2{--land:#BAC8A4;--land2:#AEBC98}
.tile{position:relative;aspect-ratio:1;background:var(--land);border:0;padding:0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .6s}
.tile:nth-child(odd){background:var(--land2)}
.tile.water{background:var(--water)}
.tile.water:nth-child(odd){background:var(--water2)}
.tile.water::after{content:"";position:absolute;left:18%;right:18%;top:48%;height:2px;border-radius:2px;background:rgba(255,255,255,.28)}
.tile.bonus{box-shadow:inset 0 0 0 3px var(--gold)}
.tile.broken svg{opacity:.4;filter:grayscale(1)}
.btn.alert{background:var(--warn);border-color:var(--warn)}
.panel textarea{width:100%;min-height:90px;font:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.harm{color:var(--warn)}
.rtable{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0 12px}
.rtable th,.rtable td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.rtable th{background:color-mix(in srgb,var(--gold) 14%,var(--surface));font-family:"Mitr",sans-serif;font-weight:500}
.rtable td:nth-child(3),.rtable td:nth-child(4),.rtable td:nth-child(5){white-space:nowrap}
.rtable td.pass{color:var(--ok);font-weight:600}.rtable td.fail{color:var(--warn);font-weight:600}.rtable td.none{color:var(--muted)}
.report{background:var(--surface);border:2px solid var(--wood);border-radius:12px;padding:14px 14px 10px;margin:12px 0}
.report h2{font-family:"Mitr",sans-serif;font-weight:500;font-size:1.25rem;margin:0 0 4px;color:var(--wood)}
.report h3{font-family:"Mitr",sans-serif;font-weight:500;font-size:1rem;margin:12px 0 4px}
.report p{margin:0 0 6px}
.sumbox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.sumbox div{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.sumbox b{display:block;font-family:"Mitr",sans-serif;font-size:1.2rem}
.tile svg{width:88%;height:88%;position:relative;z-index:1}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.float{position:absolute;left:50%;top:10%;transform:translateX(-50%);white-space:nowrap;font-size:.66rem;font-weight:600;background:var(--surface);color:var(--ink);border-radius:6px;padding:0 5px;z-index:5;pointer-events:none;animation:up 1.4s ease-out forwards;box-shadow:0 1px 2px rgba(0,0,0,.2)}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
.layer{position:absolute;inset:3px;pointer-events:none;z-index:3}
.walker{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--wood);border:2px solid var(--surface);transition:left 2.8s linear,top 2.8s linear}
.boat{position:absolute;left:-12%;width:10%;height:8%;top:65%;animation:sail 16s linear infinite}
.boat svg{width:100%;height:100%}
.boat.b2{animation-delay:-8s;top:68%}
@keyframes sail{from{left:-12%}to{left:102%}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s}
.fx.flood{opacity:1;background:linear-gradient(to bottom,transparent 49%,rgba(60,120,155,.6) 51%,rgba(60,120,155,.6) 86%,transparent 88%)}
.fx.cold{opacity:1;background:rgba(205,228,248,.6)}
.fx.drought{opacity:1;background:rgba(190,140,60,.5)}
.fx.storm{opacity:1;background:repeating-linear-gradient(115deg,rgba(110,140,175,.5) 0 3px,transparent 3px 12px)}
@media (prefers-reduced-motion: reduce){
  .float{animation:fade 1.4s linear forwards}@keyframes fade{from{opacity:1}to{opacity:0}}
  .bar i,.walker,.tile,.fx{transition:none}
  .boat{animation:none;left:30%}.boat.b2{left:65%}
}
.status{min-height:1.6em;margin:10px 2px 6px;font-size:.95rem;color:var(--muted)}
.status.warn{color:var(--warn)}
.status.ok{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 3px;color:var(--ink);font:inherit;font-size:.78rem;line-height:1.25;cursor:pointer;min-height:84px;text-align:center}
.tool svg{width:32px;height:32px}
.tool small{color:var(--muted)}
.tool[aria-pressed="true"]{border-color:var(--wood);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.tool:focus-visible,.btn:focus-visible,.mini:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;font:inherit;font-family:"Mitr",sans-serif;font-size:.95rem;padding:10px;border-radius:10px;border:2px solid var(--wood);background:var(--wood);color:#fff;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--wood)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
footer{margin-top:18px;text-align:center;color:var(--muted);font-size:.82rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.show{display:flex}
.panel{background:var(--surface);color:var(--ink);border-radius:14px;max-width:460px;width:100%;max-height:85vh;overflow:auto;padding:20px 20px 16px;border-top:6px solid var(--gold)}
.panel h2{font-family:"Mitr",sans-serif;font-weight:500;font-size:1.25rem;margin:0 0 4px;color:var(--wood)}
.panel h3{font-family:"Mitr",sans-serif;font-weight:500;font-size:1.02rem;margin:16px 0 6px}
.panel .from{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.panel p{margin:0 0 10px}
.panel ul{margin:0 0 12px;padding-left:1.2em}
.panel label{display:block;font-size:.9rem;margin:8px 0 2px}
.panel input,.panel select{width:100%;font:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card b{font-family:"Mitr",sans-serif;font-weight:500}
.card.locked{color:var(--muted);border-style:dashed}
.card p{margin:2px 0 0;font-size:.95rem}
.count{color:var(--muted);font-size:.9rem}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.opt{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:46px}
.opt[aria-pressed="true"]{border-color:var(--wood);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.orow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px}
.orow span{flex:1}
.orow button{font:inherit;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mrow{margin-bottom:8px}
.ind{color:var(--muted);font-size:.8rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:var(--gold);margin:4px 0 8px}
.stars .off{color:var(--line)}
.sheet{border:2px solid var(--wood);border-radius:10px;padding:10px 12px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <section id="menu">
    <h1>หมู่บ้านวัฒนธรรมไทย</h1>
    <p class="sub">สร้างหมู่บ้าน เรียนรู้วัฒนธรรมทั้งวัตถุธรรมและอวัตถุธรรม ครบ 4 ภาค</p>
    <div class="regions" id="regions"></div>
    <button class="btn" id="reportBtn">ผลโหมดภารกิจ</button>
    <p class="sub">แตะภาคที่ต้องการ แล้วเลือกโหมดอิสระหรือโหมดภารกิจ</p>
  </section>

  <section id="report" class="hidden"></section>

  <section id="game" class="hidden">
    <div class="topbar">
      <div><h1 id="gTitle"></h1><p class="sub" id="gMode"></p></div>
      <button class="mini" id="menuBtn">เมนู</button>
    </div>
    <div class="season">
      <div class="season-top"><b id="seasonName"></b><span id="seasonLeft"></span></div>
      <div class="bar"><i id="seasonBar"></i></div>
      <div class="mission" id="missionLine"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="mat">0</b><span>วัสดุ</span></div>
      <div class="stat"><b id="pop">0</b><span>ชาวบ้าน</span></div>
      <div class="stat" id="happyBox"><b id="happy">0</b><span>ความสุข</span></div>
      <div class="stat" id="cultBox"><b id="cult">0</b><span>วัฒนธรรม</span></div>
      <div class="stat" id="trustBox"><b id="trust">0</b><span>ความไว้ใจ</span></div>
    </div>
    <div class="board s0" id="board" role="grid" aria-label="พื้นที่หมู่บ้าน 8 คูณ 8 ช่อง">
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="tools" id="tools"></div>
    <div class="row"><button class="btn ghost" id="probBtn">ปัญหาชุมชน</button></div>
    <div class="row">
      <button class="btn" id="bookBtn">สมุดภาพ</button>
      <button class="btn ghost" id="goalBtn">เป้าหมาย</button>
      <button class="btn ghost" id="resetBtn">เริ่มใหม่</button>
    </div>
  </section>

  <footer id="foot">ลิขสิทธิ์ นายพลพิพัฒน์ ทิพยไชย และเพจสื่อและแผน</footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="panel"><div id="panelBody"></div><div class="actions" id="panelActions"></div></div>
</div>

function probDef(id){var d=problemDefs();for(var k=0;k<d.length;k++)if(d[k].id===id)return d[k];return null;}
function active(id){return state.probs.indexOf(id)>=0;}
function removeOne(t){for(var i=0;i<state.grid.length;i++)if(state.grid[i]&&state.grid[i].type===t){state.grid[i]=null;return;}}
function removeAll(t){for(var i=0;i<state.grid.length;i++)if(state.grid[i]&&state.grid[i].type===t)state.grid[i]=null;}
function spawnProblem(noReqOnly){
  var pool=problemDefs().filter(function(p){
    if(p.player||state.probUsed.indexOf(p.id)>=0)return false;
    if(noReqOnly)return !p.req&&!p.onSpawn;
    return !p.req||p.req();
  });
  if(!pool.length)return;
  var reg=pool.filter(function(p){return p.regional;});
  var P=(reg.length&&state.season>=3&&Math.random()<0.5)?reg[0]:pool[Math.floor(Math.random()*pool.length)];
  state.probs.push(P.id);state.probUsed.push(P.id);
  if(P.onSpawn)P.onSpawn();
  save();render();openProblem(P.id,true);
}
function openProblem(id,isNew){
  var P=probDef(id);if(!P)return;
  var h='<p class="from">ปัญหาชุมชน'+(isNew?" เรื่องใหม่":"")+'</p><h2 id="panelTitle">'+esc(P.title)+'</h2><p>'+esc(P.body)+'</p><p class="harm">ถ้าไม่แก้: '+esc(P.harm)+'</p><p>เลือกวิธีแก้ปัญหา</p>';
  function pick(S,conserve){
    state.mat-=S.cost;S.fn();
    state.probs=state.probs.filter(function(x){return x!==id;});state.solved++;
    var r='<h2 id="panelTitle">'+(conserve?"แก้ปัญหาแบบอนุรักษ์และปรับตัว":"แก้ปัญหาแบบเร่งด่วน")+'</h2><p>'+esc(S.gain)+'</p>';
    if(conserve){state.solvedC++;state.cons[id]=true;r+='<div class="card"><b>บัตรความรู้การอนุรักษ์: '+esc(P.card.t)+'</b><p>'+esc(P.card.b)+'</p></div><p class="ind">'+esc(indText(P.ind||"ส 4.3 ม.4–6/5"))+'</p>';}
    else r+='<p>ปัญหาจบลง แต่วัฒนธรรมของชุมชนเสียไป ลองคิดว่ามีทางที่ดีกว่านี้หรือไม่</p>';
    openPanel(r);save();render();
  }
  var btns=[];
  var c=P.con,q=P.quick;
  if(c.manual)btns.push({label:c.label,fn:function(){say("จัดผังใหม่ให้ไม่มีบ้านถูกล้อมติดกัน 3 ด้าน หรือวาง"+R.names.stage+" แล้วปัญหาจะจบเอง","warn");}});
  else btns.push({label:c.label+" (ใช้ "+c.cost+" วัสดุ)"+(state.mat<c.cost?" วัสดุไม่พอ":""),disabled:state.mat<c.cost,fn:function(){pick(c,true);}});
  btns.push({label:q.label+(q.cost?" (ใช้ "+q.cost+" วัสดุ)":""),ghost:true,disabled:state.mat<q.cost,fn:function(){pick(q,false);}});
  btns.push({label:"ปล่อยไว้ก่อน",ghost:true,fn:function(){say("ปัญหา"+P.title+"ยังค้างอยู่ "+P.harm,"warn");}});
  openPanel(h,btns,false);
}
function indText(x){return x.indexOf("ส ")===0?"สอดคล้องกับตัวชี้วัด "+x:x;}
function isHomeT(c){return c&&(c.type==="home"||c.type==="hut");}
function crowdedTiles(){
  var out=[];
  state.grid.forEach(function(c,i){if(isHomeT(c)&&nb(i).filter(function(j){return isHomeT(state.grid[j]);}).length>=3)out.push(i);});
  return out;
}
function crowdCondition(){return !state.crowdOff&&count("stage")===0&&crowdedTiles().length>0;}
function checkCrowd(){
  if(state.mode!=="free"||!state.started||state.over)return;
  var on=crowdCondition();
  if(on&&!active("crowd")){state.probs.push("crowd");save();render();openProblem("crowd",true);}
  else if(!on&&active("crowd")){
    state.probs=state.probs.filter(function(x){return x!=="crowd";});state.solved++;
    if(!state.crowdOff){
      state.solvedC++;var P=probDef("crowd");var first=!state.cons.crowd;state.cons.crowd=true;
      openPanel('<h2 id="panelTitle">แก้ชุมชนแออัดด้วยการจัดผัง</h2><p>ชุมชนมีพื้นที่ส่วนรวมแล้ว ปัญหาจบลง</p>'+(first?'<div class="card"><b>บัตรความรู้การอนุรักษ์: '+esc(P.card.t)+'</b><p>'+esc(P.card.b)+'</p></div>':'')+'<p class="ind">'+esc(indText(P.ind))+'</p>');
    }
    save();render();
  }
}
function problemEffects(notes){
  state.probs.forEach(function(id){
    if(id==="elder"||id==="canal"||id==="shadow")state.cult=clamp(state.cult-5);
    if(id==="dialect")state.trust=clamp(state.trust-5);
    if(id==="waste")state.happy=clamp(state.happy-5);
    if(id==="tourism"){state.cult=clamp(state.cult-5);state.mat+=10;}
    if(id==="lantern"){state.happy=clamp(state.happy-5);state.trust=clamp(state.trust-5);}
    if(id==="migrate"){state.happy=clamp(state.happy-5);state.mat=Math.max(0,state.mat-5);}
    if(id==="alone"){state.trust=clamp(state.trust-5);state.happy=clamp(state.happy-5);}
    if(id==="gap")state.trust=clamp(state.trust-5);
    if(id==="water")state.happy=clamp(state.happy-5);
    if(id==="corrupt"){state.mat=Math.max(0,state.mat-10);state.trust=clamp(state.trust-5);}
    if(id==="crowd"){
      state.happy=clamp(state.happy-5);
      if(Math.random()<1/3){var ct=crowdedTiles();if(ct.length){var huts=ct.filter(function(i){return state.grid[i].type==="hut";});var v=(huts.length?huts:ct)[0];
        var t=nm(state.grid[v].type);state.grid[v]=null;notes.push("ไฟไหม้"+t+" 1 หลังในชุมชนแออัด");}}
    }
  });
  if(state.probs.length)notes.push("ปัญหาชุมชนค้าง "+state.probs.length+" เรื่อง");
}

/* ---------- grid helpers ---------- */
function isWater(i){return Math.floor(i/COLS)===CANAL_ROW;}
function nb(i){var r=Math.floor(i/COLS),c=i%COLS,o=[];if(r>0)o.push(i-COLS);if(r<ROWS-1)o.push(i+COLS);if(c>0)o.push(i-1);if(c<COLS-1)o.push(i+1);return o;}
function adjType(i,t){return nb(i).some(function(j){return state.grid[j]&&state.grid[j].type===t;});}
function adjWater(i){return nb(i).some(isWater);}
function count(t){var n=0;state.grid.forEach(function(c){if(c&&c.type===t)n++;});return n;}
function homes(){return count("home")+count("hut");}
function pop(){return homes()*POP_PER_HOME;}
function has(need){return state.grid.some(function(c){return c&&BASE[c.type].need===need;});}
function pairs(a,b){var n=0;state.grid.forEach(function(c,i){if(c&&c.type===a&&adjType(i,b))n++;});return n;}
function cardTotal(){return CARD_KEYS.filter(function(k){return state.cards[k];}).length;}
function gainAt(i){
  var c=state.grid[i],g=BASE[c.type].gain;
  if(c.type==="home"&&R.riverBonus&&adjWater(i))g+=1;
  if(c.type==="market"&&R.marketWater&&adjType(i,"home"))g+=2;
  if(c.type==="craft"&&adjType(i,"home"))g+=2;
  return g;
}
function bonusIf(t,i){
  if(t==="home"&&R.riverBonus&&adjWater(i))return "เรือนริมคลองได้วัสดุเพิ่ม ชุมชนภาคกลางนิยมตั้งบ้านเรือนริมแม่น้ำลำคลอง";
  if(t==="market"&&R.marketWater&&adjType(i,"home"))return "ตลาดน้ำติดเรือนได้วัสดุเพิ่ม ชาวบ้านพายเรือจากเรือนมาค้าขาย";
  if(t==="craft"&&adjType(i,"home"))return "หัตถกรรมติดเรือนได้วัสดุเพิ่ม งานหัตถกรรมทำกันในครัวเรือน";
  if(t==="sala"&&adjType(i,"wat"))return "ศาลาการเปรียญติดวัด ความสุขเพิ่มทุกฤดู เพราะศาลาการเปรียญเป็นอาคารในวัด";
  if(t==="wat"&&adjType(i,"sala"))return "วัดติดศาลาการเปรียญ ความสุขเพิ่มทุกฤดู";
  if(t==="home"&&adjType(i,"craft"))return "เรือนติดงานหัตถกรรม หัตถกรรมได้วัสดุเพิ่ม";
  return "";
}
function validSpot(t,i){
  if(state.grid[i])return false;
  var w=(t==="market"&&R.marketWater)||!!BASE[t].water;
  return w?isWater(i):!isWater(i);
}

/* ---------- panel with queue ---------- */
var overlay=$("overlay"),pBody=$("panelBody"),pAct=$("panelActions"),dismissable=true,queue=[];
function panelOpen(){return overlay.classList.contains("show");}
function openPanel(html,buttons,canDismiss){
  if(panelOpen()){queue.push([html,buttons,canDismiss]);return;}
  pBody.innerHTML=html;pAct.innerHTML="";dismissable=canDismiss!==false;
  (buttons||[{label:"ปิด"}]).forEach(function(bt){
    var b=document.createElement("button");b.className="btn"+(bt.ghost?" ghost":"");b.textContent=bt.label;
    if(bt.disabled)b.disabled=true;
    b.addEventListener("click",function(){
      if(bt.keep){bt.fn();return;}
      overlay.classList.remove("show");if(bt.fn)bt.fn();next();
    });
    pAct.appendChild(b);
  });
  overlay.classList.add("show");pBody.scrollTop=0;overlay.querySelector(".panel").scrollTop=0;
  var f=pAct.querySelector("button");if(f)f.focus({preventScroll:true});
}
function next(){if(!panelOpen()&&queue.length){var q=queue.shift();openPanel(q[0],q[1],q[2]);}}
function closePanel(){overlay.classList.remove("show");next();}
overlay.addEventListener("click",function(e){if(e.target===overlay&&dismissable)closePanel();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&dismissable&&panelOpen())closePanel();});

/* ---------- placing ---------- */
function onTile(e){
  if(!state)return;
  var i=+e.currentTarget.getAttribute("data-i"),c=state.grid[i];
  if(state.over){say("เกมจบแล้ว กดเริ่มใหม่หรือกลับเมนู","warn");return;}
  if(!tool){if(c)showType(c.type);else say("เลือกสิ่งก่อสร้างด้านล่างก่อน แล้วแตะช่องว่างเพื่อวาง");return;}
  if(tool==="erase"){
    if(!c){say("ช่องนี้ว่างอยู่แล้ว","warn");return;}
    var back=Math.floor(BASE[c.type].cost/2);state.mat+=back;state.grid[i]=null;
    if(i===state.broken){state.broken=-1;state.probs=state.probs.filter(function(x){return x!=="decay";});}
    say("รื้อถอน"+nm(c.type)+"แล้ว ได้วัสดุคืน "+back,"ok");save();render();return;
  }
  var B=BASE[tool];
  if(c){say("ช่องนี้มีสิ่งก่อสร้างแล้ว เลือกช่องว่าง","warn");return;}
  var wOnly=(tool==="market"&&R.marketWater)||!!B.water;
  if(wOnly&&!isWater(i)){say(nm(tool)+"ต้องวางบนช่องคลอง","warn");return;}
  if(!wOnly&&isWater(i)){say(nm(tool)+"ต้องวางบนบก ไม่ใช่ในคลอง","warn");return;}
  if(B.deco&&count(tool)>=3){say(nm(tool)+"วางได้ไม่เกิน 3 ชิ้น","warn");return;}
  if(state.mat<B.cost){say("วัสดุไม่พอ ต้องใช้ "+B.cost+" มีอยู่ "+state.mat,"warn");return;}
  var bonus=bonusIf(tool,i);
  state.mat-=B.cost;state.grid[i]={type:tool,t:0};
  if(B.deco){say("วาง"+nm(tool)+"แล้ว: "+DECO_ALL[tool].fact,"ok");save();render();checkSets();return;}
  say("วาง"+nm(tool)+"แล้ว"+(bonus?" โบนัส: "+bonus:"")+(B.tempt?" ค่าวัฒนธรรมจะลดลงทุกฤดูที่ห้างยังอยู่":""),B.tempt?"warn":"ok");
  var keyMap={home:"homePlace",wat:"wat",sala:"sala",market:"market",stage:"stage",craft:"craft"};
  if(keyMap[tool])unlock(keyMap[tool],true);
  if(tool==="home"&&!state.ritual){state.ritual=true;ritualNewHome();}
  save();render();checkSets();
}
function ritualNewHome(){
  openPanel('<p class="from">ความเชื่อและพิธีกรรม</p><h2 id="panelTitle">ทำบุญขึ้นบ้านใหม่</h2><p>'+esc(R.names.home)+'หลังแรกสร้างเสร็จแล้ว ชาวบ้านถามว่าจะทำบุญขึ้นบ้านใหม่หรือไม่</p>',[
    {label:"ทำบุญ (ใช้ 5 วัสดุ)",fn:function(){
      state.mat=Math.max(0,state.mat-5);state.trust=clamp(state.trust+5);
      if(R.beliefTrigger==="newhome")unlock("belief",true);else say("ทำบุญขึ้นบ้านใหม่แล้ว ความไว้ใจเพิ่ม 5","ok");
      save();render();}},
    {label:"ไม่ทำ",ghost:true,fn:function(){say("ไม่ได้ทำบุญขึ้นบ้านใหม่");}}
  ],false);
}

        var dn=document.createElement("button");dn.textContent="▼";dn.setAttribute("aria-label","เลื่อนลง");dn.disabled=k===cur.length-1;

        row.appendChild(up);row.appendChild(dn);box.appendChild(row);
      });
    };

}

function missionTemplates(){
  var ph=state.season%3,H=R.hazard;
  return [
   {id:"m_market",text:"สร้าง"+R.names.market,check:function(){return count("market")>0;}},
   {id:"m_homes",text:"มี"+R.names.home+" 3 หลัง",check:function(){return count("home")>=3;}},
   {id:"m_salawat",text:"วางศาลาการเปรียญติดวัด",check:function(){return pairs("sala","wat")>0;}},
   {id:"m_craft",text:"วาง"+R.names.craft+"ติด"+R.names.home,check:function(){return pairs("craft","home")>0;}},
   {id:"m_stage",text:"สร้าง"+R.names.stage,check:function(){return count("stage")>0;}},
   {id:"m_pop",text:"มีชาวบ้าน 16 คน",check:function(){return pop()>=16;}},
   {id:"m_quiz",text:"ตอบคำถามของชาวบ้านให้ถูก",check:function(){return false;}},
   {id:"m_nohut",text:"ไม่มี"+R.names.hut+"เหลือก่อน"+H.name,phase:H.phase,atEnd:true,check:function(){return count("hut")===0&&homes()>0;}},
   {id:"m_fest",text:"จัดงานเทศกาลประจำฤดู",festOnly:true,check:function(){return false;}}
  ].filter(function(m){
    if(state.missionsDone.indexOf(m.id)>=0)return false;
    if(m.phase!==undefined&&m.phase!==ph)return false;
    if(m.festOnly&&festivalFor(ph)<0)return false;
    return true;
  });
}
function pickMission(){
  var t=missionTemplates();if(!t.length){state.mission=null;return;}
  var pref=t.filter(function(m){return m.phase!==undefined||m.festOnly;});
  var m=(pref.length&&Math.random()<0.6)?pref[0]:t[Math.floor(Math.random()*t.length)];
  state.mission={id:m.id,text:m.text,done:false};
}
function missionCheck(m){var t=missionTemplates().concat([]);for(var k=0;k<t.length;k++)if(t[k].id===m.id)return t[k];return null;}
function completeMission(){
  state.mission.done=true;state.missionsDone.push(state.mission.id);state.mat+=15;state.happy=clamp(state.happy+5);
  say("ภารกิจสำเร็จ: "+state.mission.text+" ได้วัสดุ 15 ความสุข +5","ok");
}

/* ---------- hazard ---------- */
function seasonStart(){
  var ph=state.season%3,H=R.hazard;
  if(state.mode==="free")pickMission();
  if(ph===H.phase){
    var lv;
    if(state.mode==="mission"&&state.mid==="hz")lv=2;
    else{var r=Math.random();lv=r<0.3?0:(r<0.7?1:2);}
    state.hazLevel=lv;
    say("เริ่ม"+R.seasons[ph]+" พยากรณ์: "+H.when+H.forecast[lv],"warn");
  }else say("เริ่ม"+R.seasons[ph],"ok");
}
function doHazard(){
  var H=R.hazard,lv=state.hazLevel<0?1:state.hazLevel;
  var idx=[];state.grid.forEach(function(c,i){if(c&&c.type==="hut")idx.push(i);});
  var lose=lv===0?0:(lv===1?Math.ceil(idx.length/2):idx.length);
  shuffle(idx).slice(0,lose).forEach(function(i){state.grid[i]=null;});
  state.hazLost+=lose;state.hazDone=true;
  state.happy=clamp(state.happy-5*lose);
  if(!reduced){fxEl.className="fx "+H.fx;setTimeout(function(){fxEl.className="fx";},2600);}
  var h='<p class="from">'+esc(H.when)+'</p><h2 id="panelTitle">'+esc(H.title)+'</h2><p>ความรุนแรง: '+["เล็กน้อย","ปานกลาง","หนัก"][lv]+'</p>';
  h+=lose>0?'<p>'+esc(R.names.hut)+'เสียหาย '+lose+' หลัง ชาวบ้าน '+(lose*POP_PER_HOME)+' คนต้องย้ายออก ความสุข −'+(5*lose)+'</p>':'<p>ไม่มีบ้านเสียหาย</p>';
  var safe=count("home");
  if(safe>0)h+='<p>'+esc(R.names.home)+' '+safe+' หลัง'+esc(H.safe)+'</p>';
  openPanel(h,[{label:"ต่อไป",fn:function(){if(safe>0)unlock("homeHazard",true);save();render();}}],false);
}

/* ---------- season end ---------- */
function endSeason(){
  var ph=state.season%3,notes=[];
  if(state.mission&&!state.mission.done){var m=missionCheck(state.mission);if(m&&m.atEnd&&m.check())completeMission();}
  if(ph===R.hazard.phase)doHazard();
  if(pop()>0){
    [["merit","ที่ทำบุญ"],["trade","ที่ค้าขาย"],["play","ที่เล่น"]].forEach(function(n){
      if(has(n[0]))state.happy=clamp(state.happy+5);else{state.happy=clamp(state.happy-5);notes.push("ขาด"+n[1]);}
    });
    var sw=pairs("sala","wat");if(sw)state.happy=clamp(state.happy+2*sw);
  }
  problemEffects(notes);
  if(pop()>0){var si=intactSets().length;var dt=DECO_BY[state.region].filter(function(k){return count(k)>0;}).length;state.happy=clamp(state.happy+2*si+dt);}
  var ct=0;TRAD.forEach(function(t){if(count(t)>0)ct++;});
  state.cult=clamp(state.cult+3*ct-10*count("mall"));
  if(state.happy<30&&homes()>0){
    var gone=-1;for(var i=0;i<state.grid.length;i++)if(state.grid[i]&&state.grid[i].type==="hut"){gone=i;break;}
    if(gone<0)for(var j=0;j<state.grid.length;j++)if(state.grid[j]&&state.grid[j].type==="home"){gone=j;break;}
    if(gone>=0){state.grid[gone]=null;notes.push("ความสุขต่ำ ชาวบ้านย้ายออก 1 หลัง");}
  }
  state.season++;state.sec=0;
  var lostNow=state.mode==="free"&&state.season>=2&&homes()===0;
  if(lostNow||state.season>=total()){state.over=true;state.lost=lostNow;save();render();finish();return;}
  if(notes.length)setTimeout(function(){say(notes.join(" "),"warn");},50);
  save();render();
}
function finish(){
  if(state.mode==="mission"){missionEnd();return;}
  var s=0;
  if(!state.lost&&pop()>0)s++;
  if(s&&state.happy>=60&&state.cult>=60&&state.trust>=60&&state.probs.length===0)s++;
  if(cardTotal()>=CARD_KEYS.length)s++;
  var st="";for(var k=0;k<3;k++)st+=k<s?"★":'<span class="off">★</span>';
  var h='<h2 id="panelTitle">'+(state.lost?"หมู่บ้านร้าง":"ครบ 9 ฤดูแล้ว")+'</h2><div class="stars" aria-label="ได้ '+s+' ดาว">'+st+'</div>';
  if(state.lost)h+='<p>ไม่มีบ้านเหลือ ชาวบ้านย้ายออกทั้งหมด</p>';
  h+='<ul><li>ชาวบ้าน '+pop()+' คน</li><li>ความสุข '+state.happy+' วัฒนธรรม '+state.cult+' ความไว้ใจ '+state.trust+'</li><li>บ้านเสียหายจาก'+esc(R.hazard.name)+' '+state.hazLost+' หลัง</li><li>ปัญหาชุมชนแก้แล้ว '+state.solved+' เรื่อง (วิธีอนุรักษ์ '+state.solvedC+' เรื่อง) ค้างอยู่ '+state.probs.length+' เรื่อง</li><li>ตอบคำถามถูก '+state.correct+' จาก '+state.asked+' ข้อ</li><li>บัตรความรู้ '+cardTotal()+' จาก '+CARD_KEYS.length+' ใบ</li></ul>';
  openPanel(h,[{label:"เล่นใหม่",fn:function(){startFree(state.region,true);}},{label:"เปิดสมุดภาพ",ghost:true,fn:openBook},{label:"กลับเมนู",ghost:true,fn:toMenu}],false);
}

/* ---------- loop ---------- */
setInterval(function(){
  if(!running||!state||!state.started||state.over||panelOpen())return;
  state.sec++;
  if(state.sec===1)seasonStart();
  var p=pop(),ph=state.season%3;
  state.grid.forEach(function(c,i){
    if(!c)return;var B=BASE[c.type];if(B.deco)return;
    if(!B.home&&p===0)return;
    if(c.type==="market"&&(state.marketStop===state.season||active("canal")))return;
    if(c.type==="stage"&&(active("online")||active("shadow")))return;
    if(i===state.broken)return;
    c.t=(c.t||0)+1;
    if(c.t>=B.every){
      c.t=0;var g=gainAt(i);if(c.type==="craft"&&active("youth"))g=Math.max(1,Math.floor(g/2));if(c.type==="home"&&active("water"))g=Math.max(1,Math.floor(g/2));state.mat+=g;state.acts[c.type]=(state.acts[c.type]||0)+1;
      floatText(i,R.acts[c.type]+" +"+g);
      var ak={market:"food",stage:"music",craft:"dress"}[c.type];
      if(ak&&state.acts[c.type]>=ACT_GOAL)unlock(ak,false);
    }
  });
  if(state.mode==="free"&&state.mission&&!state.mission.done){var m=missionCheck(state.mission);if(m&&!m.atEnd&&m.check())completeMission();}
  if(state.sec===3){
    if(state.mode==="free"&&SPAWN[state.season])spawnProblem(false);
    if(state.mode==="mission"&&state.mid==="pb"&&state.season<2)spawnProblem(true);
  }
  if(state.mode==="free"&&state.sec===8)randomEvent();
  if(state.sec===15){var fk=festivalFor(ph);
    if(fk>=0&&(state.mode==="free"||state.mid==="f"+fk))holdFestival(fk);}
  if(state.mode==="free"&&state.sec===25)seasonQuestion();
  if(state.sec>=SEASON_SEC)endSeason();
  if(!state.over)checkCrowd();
  save();render();
},1000);

setInterval(function(){
  if(!running||!state||reduced)return;
  var occ=[];state.grid.forEach(function(c,i){if(c)occ.push(i);});
  var n=pop()>0?Math.min(6,homes()*2):0;
  walkers.forEach(function(w,k){
    if(k>=n||!occ.length){w.style.display="none";return;}
    w.style.display="block";
    var i=occ[Math.floor(Math.random()*occ.length)],r=Math.floor(i/COLS),c=i%COLS;

    w.style.top=((r+0.55+Math.random()*0.35)/ROWS*100)+"%";
  });
},3000);
